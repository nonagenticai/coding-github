# Alembic config for coding-github's own `coding_github` database
# (CI-checks wait store). In-cluster the `migrate` initContainer runs
# `alembic upgrade head` with DATABASE_URL pointed at PgBouncer; alembic/env.py
# reads DATABASE_URL and overrides sqlalchemy.url below.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
sqlalchemy.url = postgresql+psycopg://localhost:5432/coding_github

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
